<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chrome Presence</title>
    <link rel="icon" href="../../icons/icon32.png">
    <link rel="stylesheet" href="../ui/theme.css">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body class="popup-page">
    <header class="popup-head">
      <div class="brand">
        <img src="../../icons/icon32.png" alt="" width="30" height="30">
        <span>
          <strong>Chrome Presence</strong>
          <small id="popup-status">Connecting…</small>
        </span>
      </div>
      <button id="settings" class="icon-btn" type="button" aria-label="Open settings" title="Settings">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.6a1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15.4 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9c.1.38.31.73.6 1 .3.26.68.4 1.1.4H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51.6Z"></path>
        </svg>
      </button>
    </header>

    <main class="popup-main">
      <section class="share-row" aria-labelledby="share-label">
        <div>
          <p id="share-label" class="mini-label">Share presence</p>
          <p id="share-hint" class="mini-hint">On</p>
        </div>
        <label class="switch">
          <input id="enabled-toggle" type="checkbox" role="switch" aria-label="Share presence">
          <span class="switch-track" aria-hidden="true"></span>
        </label>
      </section>

      <section class="preview-card" aria-labelledby="preview-heading">
        <div class="preview-head">
          <p id="preview-heading" class="presence-app">Chrome</p>
          <span id="live-badge" class="badge" data-tone="neutral">Paused</span>
        </div>
        <div class="preview-body">
          <div class="preview-art">
            <img src="../../icons/icon128.png" alt="">
          </div>
          <div class="preview-copy">
            <p id="preview-details" class="preview-details">No activity</p>
            <p id="preview-state" class="preview-state" hidden></p>
            <p id="preview-time" class="preview-time" hidden></p>
          </div>
        </div>
        <p id="current-tab" class="current-tab"></p>
      </section>

      <div id="setup-banner" class="banner" data-tone="warn" hidden>
        <div>
          <strong>App ID missing</strong>
          <p>Enter the Application ID of your Discord app to get started.</p>
        </div>
        <button id="setup-button" class="btn btn-secondary" type="button">Set up</button>
      </div>

      <div id="error-banner" class="banner" data-tone="danger" hidden>
        <div>
          <strong id="error-title">Connection failed</strong>
          <p id="error-text"></p>
        </div>
        <button id="reconnect" class="btn btn-secondary" type="button">Reconnect</button>
      </div>
    </main>

    <footer class="popup-foot">
      <button id="options-link" class="btn btn-quiet" type="button">Settings</button>
      <a class="foot-link" href="https://discord.com/developers/applications" target="_blank" rel="noreferrer">Discord Portal ↗</a>
    </footer>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
